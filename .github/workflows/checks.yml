name: Checks
on:
  pull_request:
  push:
    branches-ignore: [deploy]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install -y nginx libnginx-mod-stream openssl
      - run: uv run python -m unittest discover -s tests -v
        env:
          NGINX_INTEGRATION_BIN: /usr/sbin/nginx
      - run: uv run alembic upgrade head && uv run alembic check
        env:
          DB_URL: sqlite+aiosqlite:///migration-check.db
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
